<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="toolsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>

    <!-- Glowing Cyan/Blue Gradient -->
    <linearGradient id="toolsNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="toolsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#toolsBgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#toolsNeonGrad)" stroke-width="2.5" stroke-opacity="0.85" />

  <!-- Layered Code Terminal Frame -->
  <g filter="url(#toolsGlow)">
    <rect x="20" y="20" width="24" height="24" rx="6" fill="none" stroke="#38bdf8" stroke-width="3.2" stroke-opacity="0.75" transform="rotate(-15 32 32)" />

    <!-- Precision Wrench -->
    <g transform="translate(32, 32) rotate(45) translate(-32, -32)">
      <!-- Wrench Handle -->
      <line x1="32" y1="21" x2="32" y2="44" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
      <!-- Inner accent groove -->
      <line x1="32" y1="26" x2="32" y2="38" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" />
      <!-- Wrench Jaw Head -->
      <path d="M 24 20 C 24 13, 40 13, 40 20 C 40 23, 37 25, 36 25 L 36 19 L 28 19 L 28 25 C 27 25, 24 23, 24 20 Z" fill="#ffffff" />
      <!-- Wrench Ring Tail -->
      <circle cx="32" cy="46" r="4.5" fill="#161b22" stroke="#ffffff" stroke-width="3" />
    </g>
  </g>
</svg>
