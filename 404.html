<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Tools Directory</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .code {
      font-size: 4rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #022c22;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
  <script>
    (function() {
      var path = window.location.pathname;
      var query = window.location.search || '';
      var hash = window.location.hash || '';
      var appSegment = '/get-a-discounted-hair-cut';
      var idx = path.indexOf(appSegment);
      
      // If the URL is within the get-a-discounted-hair-cut micro-app (e.g. /OH, /CA, /TX)
      if (idx !== -1) {
        var basePath = path.substring(0, idx + appSegment.length) + '/';
        var afterSegment = path.substring(idx + appSegment.length).replace(/^\/+/, '').replace(/\/+$/, '');
        
        sessionStorage.setItem('ghp_redirect_path', afterSegment);
        sessionStorage.setItem('ghp_redirect_full_url', window.location.href);
        window.location.replace(basePath + query + hash);
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a href="/tools/" class="btn">Return to Tools Directory</a>
  </div>
</body>
</html>
