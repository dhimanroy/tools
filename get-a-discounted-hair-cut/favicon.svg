<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Dotted coupon cut line -->
  <line x1="8" y1="32" x2="18" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" stroke-opacity="0.6"/>
  <line x1="46" y1="32" x2="56" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" stroke-opacity="0.6"/>

  <!-- Scissors Icon -->
  <g transform="translate(14, 14)" filter="url(#shadow)">
    <!-- Finger Rings -->
    <circle cx="8" cy="8" r="5" fill="none" stroke="url(#accentGrad)" stroke-width="3.2" />
    <circle cx="8" cy="28" r="5" fill="none" stroke="url(#accentGrad)" stroke-width="3.2" />
    
    <!-- Central Pivot Pin -->
    <circle cx="18" cy="18" r="2" fill="#ffffff" />

    <!-- Blades -->
    <line x1="12" y1="11" x2="31" y2="30" stroke="url(#accentGrad)" stroke-width="3.2" stroke-linecap="round" />
    <line x1="12" y1="25" x2="31" y2="6" stroke="url(#accentGrad)" stroke-width="3.2" stroke-linecap="round" />
  </g>
</svg>
