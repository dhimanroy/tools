<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deckBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12171f" />
      <stop offset="100%" stop-color="#090c10" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="deckBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Top Isometric Mesh Face Gradient -->
    <linearGradient id="topFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15" />
    </linearGradient>

    <!-- Left Face Gradient -->
    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Right Face Gradient -->
    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="deckGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#deckBgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#deckBorderGrad)" stroke-width="2" stroke-opacity="0.85" />

  <!-- 3D Computational Mesh / Deck Block -->
  <g filter="url(#deckGlow)" transform="translate(0, 1)">
    <!-- Top Isometric Face -->
    <polygon points="32,13 49,23 32,33 15,23" fill="url(#topFaceGrad)" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Left Face -->
    <polygon points="15,23 32,33 32,50 15,40" fill="url(#leftFaceGrad)" stroke="#6366f1" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Right Face -->
    <polygon points="32,33 49,23 49,40 32,50" fill="url(#rightFaceGrad)" stroke="#818cf8" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Top Grid Lines (DNS 3D Mesh Cells) -->
    <line x1="23.5" y1="18" x2="40.5" y2="28" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="40.5" y1="18" x2="23.5" y2="28" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Front Left Grid Lines -->
    <line x1="23.5" y1="28" x2="23.5" y2="45" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.75" />
    <line x1="15" y1="31.5" x2="32" y2="41.5" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.75" />

    <!-- Front Right Grid Lines -->
    <line x1="40.5" y1="28" x2="40.5" y2="45" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.75" />
    <line x1="32" y1="41.5" x2="49" y2="31.5" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.75" />

    <!-- Active Parameter / Node Highlight -->
    <circle cx="32" cy="33" r="2.4" fill="#ffffff" />
    <circle cx="23.5" cy="18" r="1.5" fill="#38bdf8" />
    <circle cx="40.5" cy="18" r="1.5" fill="#38bdf8" />
  </g>
</svg>
