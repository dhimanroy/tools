name: Tools Hub Deployment & Autonomous Services

on:
  # Autonomous Heartbeat Cron: checks every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Manual on-demand trigger via GitHub Actions tab
  workflow_dispatch:
    inputs:
      force:
        description: 'Force immediate Great Clips crawl (bypasses 3-7 day schedule gatekeeper)'
        required: false
        type: boolean
        default: false

  # Trigger build & deployment whenever code is pushed to source or main
  push:
    branches:
      - source
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check_deploy.outputs.should_deploy }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git Identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Source Branch into Main
        if: github.event_name == 'push' && github.ref == 'refs/heads/source'
        run: |
          echo "Merging latest code from source branch into main..."
          git fetch origin source:source
          git merge --no-edit -X theirs source || {
            git commit -m "chore(sync): merge source branch into main [skip ci]"
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Crawler Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f get-a-discounted-hair-cut/crawler/requirements.txt ]; then
            pip install -r get-a-discounted-hair-cut/crawler/requirements.txt
          fi

      - name: Run Autonomous Services (Great Clips & Other Tools)
        id: gc_crawler
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "::notice::Executing forced crawl requested by user..."
            python get-a-discounted-hair-cut/crawler/crawler.py --force
          else
            echo "::notice::Checking schedule gatekeeper (3-7 days interval)..."
            python get-a-discounted-hair-cut/crawler/crawler.py --check
          fi

      - name: Commit & Push Updates to Main
        id: commit_main
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            echo "Staged changes found. Committing dataset updates..."
            git commit -m "chore(auto): update autonomous services dataset [skip ci]"
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Pushing changes to origin/main..."
            git push origin main
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "main is already up to date with origin/main."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Deployment Need
        id: check_deploy
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.commit_main.outputs.pushed }}" = "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup GitHub Pages
        if: steps.check_deploy.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.check_deploy.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
