name: Autonomous Coupon Crawler

on:
  # Daily check (once a day at 06:00 UTC) to verify if 3-7 day crawl window is reached
  schedule:
    - cron: '0 6 * * *'

  # Manual on-demand trigger via GitHub Actions tab
  workflow_dispatch:
    inputs:
      force:
        description: 'Force immediate crawl (bypasses 3-7 day gatekeeper)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: 'coupon-crawler'
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Crawler Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f get-a-discounted-hair-cut/crawler/requirements.txt ]; then
            pip install -r get-a-discounted-hair-cut/crawler/requirements.txt
          fi

      - name: Run Crawler Service
        id: crawler
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "::notice::Executing forced crawl requested by user..."
            python get-a-discounted-hair-cut/crawler/crawler.py --force
          else
            echo "::notice::Checking schedule gatekeeper (3-7 days interval)..."
            python get-a-discounted-hair-cut/crawler/crawler.py --check
          fi

      - name: Commit & Push Dataset Updates to Main
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add get-a-discounted-hair-cut/data/coupons.json get-a-discounted-hair-cut/data/schedule_state.json || true

          if ! git diff --staged --quiet; then
            echo "New coupon data detected. Committing..."
            git commit -m "chore(auto): update coupon dataset [skip ci]"
            git push origin main
          else
            echo "No coupon changes detected to commit."
          fi
